permalink: /:basename/

collections:
  success_stories:
    output: true
    permalink: /success-stories/:path/
  torch_bearers:
    output: true
    permalink: /torch_bearers/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: none
  - scope:
      path: ""
      type: success_stories
    values:
      layout: success_story
  - scope:
      path: ""
      type: torch_bearers
    values:
      layout: torch_bearer