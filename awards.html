<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Awards & Recognitions | Swami Vivekanand Students' Welfare Charitable Trust</title>
  <meta name="description" content="Awards and recognitions received by the Trust and its leadership for their contribution to girls' education and women's empowerment." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/gallery.css" />
</head>
<body class="gallery-page">

  <div id="header-placeholder"></div>

  <main class="container gallery-page__wrapper">
    <h1 class="mb-4 text-center">Awards &amp; Recognition</h1>
    <div class="gallery-grid-images" id="awards-grid" aria-live="polite"></div>
  </main>

  <!-- Lightbox modal — shared markup contract with gallery-page.js -->
  <div class="modal fade gallery-lightbox-modal" id="awardsImageModal"
       tabindex="-1" aria-labelledby="awardsImageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">
          <div class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-inner"></div>
            <button class="carousel-control-prev" type="button" data-bs-target=".gallery-lightbox-modal .carousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target=".gallery-lightbox-modal .carousel" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
        <button type="button" class="btn-close position-absolute top-0 end-0 m-3"
                data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/script.js"></script>
  <script src="/assets/js/gallery-page.js"></script>
  <script>
    loadHTML('header-placeholder', 'header.html', initHeaderSubmenu);
    loadHTML('footer-placeholder', 'footer.html', initBackToTop);

    initGalleryPage({
      dataUrl:       '/assets/json/awards.json',
      gridId:        'awards-grid',
      modalId:       'awardsImageModal',
      altTextPrefix: 'Award'
    });
  </script>
</body>
</html>
