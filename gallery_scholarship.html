<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scholarship Distribution Gallery | Swami Vivekanand Students' Welfare Charitable Trust</title>
  <meta name="description" content="News coverage of the Swami Vivekanand Students' Welfare Charitable Trust from 1996 to today." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/gallery.css" />
</head>
<body class="gallery-page">

  <div id="header-placeholder"></div>

  <main class="container gallery-page__wrapper">
    <div class="page-hero" style="padding-top:0;">
      <h1>Scholarship Distribution Gallery</h1>
    </div>

    <div class="gallery-year-btns" id="gallery-year-btns" role="tablist" aria-label="Filter by year"></div>
    <div class="gallery-grid-images" id="gallery" aria-live="polite"></div>
  </main>

  <!-- Lightbox modal (shared markup contract with gallery-page.js) -->
  <div class="modal fade" id="galleryImageModal" tabindex="-1" aria-labelledby="galleryImageModalLabel">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content bg-dark">
        <div class="modal-header border-0">
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0">
          <div id="carouselImages" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselImages" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselImages" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/script.js"></script>
  <script src="/assets/js/gallery-page.js"></script>
  <script>
    loadHTML('header-placeholder', '/header.html', initHeaderSubmenu);
    loadHTML('footer-placeholder', '/footer.html', initBackToTop);

    initGalleryPage({
  dataUrl:       '/assets/json/gallery-scholarship.json',
  gridId:        'gallery',
  yearBtnsId:    'gallery-year-btns',
  modalId:       'galleryImageModal',
  altTextPrefix: 'Scholarship distribution event'
});
  </script>
</body>
</html>
