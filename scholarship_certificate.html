<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scholarship Financial Reports | Swami Vivekanand Students' Welfare Charitable Trust</title>
  <meta name="description" content="Balance sheets and Income & Expenditure statements for the Trust, available for download for every year since inception in 1996." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/pdf-grid.css" />
</head>
<body class="pdf-grid-page">

  <div id="header-placeholder"></div>

  <main class="container mt-5">
    <h1 class="mb-3 text-center">Scholarship Financial Reports</h1>
<p class="pdf-grid-intro">
  Scholarship receipt certificates for the past five years, plus a full summary of scholarships
  disbursed since 1996.
</p>
<div class="row justify-content-center" id="pdf-grid"></div>

  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/script.js"></script>
  <script src="/assets/js/pdf-grid.js"></script>
  <script>
    loadHTML('header-placeholder', 'header.html', initHeaderSubmenu);
    loadHTML('footer-placeholder', 'footer.html', initBackToTop);

    initPdfGrid({
  dataUrl:     '/assets/json/scholarship-receipts.json',
  containerId: 'pdf-grid',
  colClasses:  'col-6 col-sm-4 col-md-2',
  ariaLabel:   'Scholarship receipt certificates and summary'
});
  </script>
</body>
</html>
