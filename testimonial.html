<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testimonials | Swami Vivekanand Students' Welfare Charitable Trust</title>
  <meta name="description" content="Hear directly from students and dignitaries about the impact of the Swami Vivekanand Students' Welfare Charitable Trust." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/testimonial.css" />
</head>
<body class="page-bg">

  <div id="header-placeholder"></div>

  <div class="page-hero">
    <span class="page-hero__eyebrow">In Their Own Words</span>
    <h1>Testimonials</h1>
    <div class="page-hero__divider"></div>
    <p class="page-hero__sub">
      Hear directly from the students we've supported, and from the educators and
      dignitaries who have watched this mission unfold over the years.
    </p>
  </div>

  <main class="testimonial-page-wrap">
    <div id="testimonial-tabs" class="testimonial-tabs"></div>
    <div id="testimonial-grid" class="testimonial-grid" aria-live="polite"></div>
  </main>

  <!-- Shared video modal — one iframe, reused for every testimonial -->
  <div class="modal fade testimonial-video-modal" id="testimonialVideoModal"
       tabindex="-1" aria-labelledby="testimonialVideoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
                style="z-index: 2;" data-bs-dismiss="modal" aria-label="Close video"></button>
        <div class="modal-body">
          <iframe src="" title="" allow="autoplay" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/script.js"></script>
  <script src="/assets/js/testimonial-page.js"></script>
  <script>
    loadHTML('header-placeholder', 'header.html', initHeaderSubmenu);
    loadHTML('footer-placeholder', 'footer.html', initBackToTop);

    initTestimonialPage({
      dataUrl: '/assets/json/testimonial-videos.json',
      tabsId:  'testimonial-tabs',
      gridId:  'testimonial-grid',
      modalId: 'testimonialVideoModal'
    });
  </script>
</body>
</html>
