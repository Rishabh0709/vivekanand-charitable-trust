<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | Swami Vivekanand Students’ Welfare Charitable Trust</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <style>
    body {
      background: #f5f7ff;
      font-family: "Inter", sans-serif;
    }

    .thank-card {
      max-width: 650px;
      margin: 100px auto;
      padding: 45px 35px;
      background: white;
      border-radius: 22px;
      border-top: 6px solid #ff8f00; /* saffron accent */
      box-shadow: 0 10px 35px rgba(26, 35, 126, 0.15);
      text-align: center;
    }

    .thank-icon {
      font-size: 70px;
      color: #1a237e; /* trust blue */
      margin-bottom: 20px;
    }

    .btn-home {
      margin-top: 25px;
      padding: 12px 28px;
      font-size: 1.05rem;
      border-radius: 12px;
      background: #1a237e;
      border: none;
    }

    .btn-home:hover {
      background: #0f1550;
    }

    .countdown {
      margin-top: 15px;
      font-weight: 600;
      color: #ff8f00;
    }
  </style>

  <script>
    // Auto Redirect in 5 seconds
    let seconds = 5;
    function countdownTimer() {
      let timer = document.getElementById("countdown");
      timer.innerText = seconds;
      seconds--;

      if (seconds < 0) {
        window.location.href = "index.html"; // redirect to homepage
      } else {
        setTimeout(countdownTimer, 1000);
      }
    }
    window.onload = countdownTimer;
  </script>

</head>

<body>

  <div class="thank-card">
    <i class="fa-solid fa-circle-check thank-icon"></i>

    <h2 class="fw-bold" style="color:#1a237e;">Thank You!</h2>

    <p class="text-muted mt-3" style="font-size: 1.1rem;">
      Your message has been successfully sent.  
      We truly appreciate your interest and will reach out to you shortly.
    </p>

    <p class="countdown">
      Redirecting to homepage in <span id="countdown">5</span> seconds…
    </p>

    <a href="index.html" class="btn btn-home">
      <i class="fa-solid fa-arrow-left me-2"></i>
      Back to Home
    </a>
  </div>

</body>
</html>
